<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Note It!</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #151830; color: #F4F5FA; }
  .card { text-align: center; padding: 24px; max-width: 360px; }
  a { color: #8FD3FF; }
</style>
</head>
<body>
<div class="card">
  <h1 id="t">Volviendo a Note It!…</h1>
  <p id="m">Un momento.</p>
  <p><a id="l" href="#" hidden>Abrir Note It!</a></p>
</div>
<script>
  // Vuelta de Google: se pasa el código a la app que empezó el inicio de
  // sesión (lo dice "state": web, app del móvil u ordenador con su puerto).
  (function () {
    var q = new URLSearchParams(location.search);
    var code = q.get("code"), state = q.get("state") || "", error = q.get("error");
    var target = state.split(".")[0];
    var args = "gcode=" + encodeURIComponent(code || "") + "&gstate=" + encodeURIComponent(state) + (error ? "&gerror=" + encodeURIComponent(error) : "");
    var url;
    if (target === "web") url = "/?" + args;
    else if (target === "app") url = "io.noteit.app://login-callback?" + args;
    else if (/^desk\d+$/.test(target)) url = "http://localhost:" + target.slice(4) + "/callback?" + args;
    if (!url) {
      document.getElementById("t").textContent = "No se pudo iniciar sesión";
      document.getElementById("m").textContent = "Vuelve a Note It! e inténtalo de nuevo.";
      return;
    }
    var l = document.getElementById("l");
    l.href = url;
    location.replace(url);
    // Si el navegador no abre la app solo, queda el enlace.
    setTimeout(function () { l.hidden = false; document.getElementById("m").textContent = "Si no se abre sola:"; }, 1500);
  })();
</script>
</body>
</html>
